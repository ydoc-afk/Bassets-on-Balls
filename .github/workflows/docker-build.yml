name: Docker build

on:
  push:
    branches: [main, nightly]
    tags: ["v*"]
  # Check that the images still build (nothing is pushed for PRs)
  pull_request:

permissions:
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wolf-ui
            context: .
            dockerfile: Dockerfile
            build-args: ""
          - name: kubuntu
            context: apps/kubuntu/build
            dockerfile: Dockerfile
            build-args: "BASE_APP_IMAGE=ghcr.io/games-on-whales/base-app:edge"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set derived configuration variables:
      # - images: images to build (docker and/or github)
      # - push: if images need to be uploaded to repository (not for PRs)
      # - cache_from: image tag to use for imported cache
      # - cache_to: image tag to use for exported cache
      # - github_server_url: reference to source code repository
      - name: Prepare
        id: prep
        run: |
          REGISTRY_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}"
          echo "images=${REGISTRY_IMAGE}" >> $GITHUB_OUTPUT
          echo "push=${{ github.event_name != 'pull_request' }}" >> $GITHUB_OUTPUT
          # The nightly branch keeps its own cache so it doesn't evict main's
          CACHE_TAG=buildcache
          if [ "${{ github.ref }}" = "refs/heads/nightly" ]; then CACHE_TAG=buildcache-nightly; fi
          # Only import the registry cache when we're pushing: for PRs the
          # package may not exist on GHCR yet, and anonymous pulls of a
          # missing package 403 and fail the build.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "cache_from=type=registry,ref=${REGISTRY_IMAGE}:${CACHE_TAG}" >> $GITHUB_OUTPUT
          else
            echo "cache_from=" >> $GITHUB_OUTPUT
          fi
          echo "cache_to=type=registry,ref=${REGISTRY_IMAGE}:${CACHE_TAG},mode=max" >> $GITHUB_OUTPUT
          echo "github_server_url=${GITHUB_SERVER_URL}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: ${{ steps.prep.outputs.images }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            # Calendar versions like v2026.10.0 aren't valid semver (leading zero), tag them as-is too
            type=ref,event=tag
            type=match,pattern=v(.*),group=1
            type=edge,branch=main
            type=ref,event=branch
            type=raw,value=alpha,enable=${{ github.ref != 'refs/heads/nightly' }}
            type=sha
          flavor: latest=false # let's not produce a :latest tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
          version: latest
          driver-opts: image=moby/buildkit:master

      - name: Login to GitHub Container Registry
        if: steps.prep.outputs.push == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: ${{ steps.prep.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.prep.outputs.cache_from }}
          cache-to: ${{ steps.prep.outputs.push == 'true' && steps.prep.outputs.cache_to || '' }}
